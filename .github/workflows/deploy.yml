name: Deploy Hexo to GitHub Pages

on:
  # 每次推送到 main 分支就自动构建并部署
  push:
    branches:
      - main
  # 也支持在 GitHub 网页上手动点击触发
  workflow_dispatch:

# 允许 Actions 发布到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务；不取消正在进行的部署，避免线上出现半成品
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成静态页面
        run: npx hexo generate

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
